<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register · Modern App</title>
  <link rel="stylesheet" href="register.css" />
<script src="login.js"></script>
</head>
<body>
  <main class="container">
    <div class="card">
      <div class="logo">
        <span class="logo-icon">◆</span>
        <span class="logo-text">CodeUI</span>
      </div>

      <h1 class="title">Create Account</h1>
      <p class="subtitle">Join us and start your journey today</p>

      <form class="form" action="#" method="post" novalidate>
        <div class="input-group">
          <label for="name" class="input-label">Full Name</label>
          <input
            type="text"
            id="name"
            class="input"
            placeholder="Anurag Kumar"
            required
            autocomplete="name"
          />
        </div>

        <div class="input-group">
          <label for="username" class="input-label">Username</label>
          <input
            type="text"
            id="username"
            class="input"
            placeholder="oxanuragofficial"
            required
            autocomplete="username"
          />
        </div>

        <div class="input-group">
          <label for="email" class="input-label">Email address</label>
          <input
            type="email"
            id="email"
            class="input"
            placeholder="you@gmail.com"
            required
            autocomplete="email"
          />
        </div>

        <div class="input-group">
          <label for="password" class="input-label">Password</label>
          <input
            type="password"
            id="password"
            class="input"
            placeholder="••••••••"
            required
            autocomplete="new-password"
          />
        </div>

        <div class="input-group">
          <label for="confirmPassword" class="input-label">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            class="input"
            placeholder="••••••••"
            required
            autocomplete="new-password"
          />
        </div>

        <div class="form-actions terms-wrapper">
          <label class="checkbox-wrapper">
            <input type="checkbox" id="terms" class="checkbox" required />
            <span class="checkbox-label">
              I agree to the <a href="#" class="link terms-link">Terms &amp; Conditions</a>
            </span>
          </label>
        </div>

        <button type="submit" id="registerBtn" class="btn btn-primary">
          Create Account
        </button>
      </form>

      <div class="divider">
        <span class="divider-line"></span>
        <span class="divider-text">or</span>
        <span class="divider-line"></span>
      </div>

      <div class="social-row">
        <button id="googleBtn" class="btn btn-social" aria-label="Sign up with Google">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          <span>Google</span>
        </button>
        <button id="githubBtn" class="btn btn-social" aria-label="Sign up with GitHub">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.15 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.62.24 2.85.12 3.15.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          <span>GitHub</span>
        </button>
      </div>

      <p class="footer-text">
        Already have an account? <a href="index.html" class="link create-link">Sign In</a>
      </p>
    </div>
  </main>
</body>
</html>
